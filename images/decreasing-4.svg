  <text class="size" x="960" y="466">n = 0</text>
  <text class="local" x="960" y="491">base: 0</text>
  <text class="depth" x="1080" y="119">depth 0</text>
  <text class="level" x="1080" y="145">1 call, size 3</text>
  <text class="level" x="1080" y="171">level prints: 1</text>
  <text class="depth" x="1080" y="229">depth 1</text>
  <text class="level" x="1080" y="255">2 calls, size 2</text>
  <text class="level" x="1080" y="281">level prints: 2</text>
  <text class="depth" x="1080" y="339">depth 2</text>
  <text class="level" x="1080" y="365">4 calls, size 1</text>
  <text class="level" x="1080" y="391">level prints: 4</text>
  <text class="depth" x="1080" y="449">depth 3</text>
  <text class="level" x="1080" y="475">8 calls, size 0</text>
  <text class="level" x="1080" y="501">level prints: 0</text>
  <text class="summary" x="36" y="553">Prints: 1 + 2 + 4 = 7. Total calls: 1 + 2 + 4 + 8 = 15.</text>
  <text class="subtitle" x="36" y="590">The number of calls doubles each level. The last level contains eight base calls.</text>
  <text class="note" x="36" y="626">Work labels count only println calls. Base calls print nothing but still take Θ(1) time.</text>
  <text class="note" x="36" y="654">Root depth 0; sample height 3. Each arrow is one recursive call.</text>
</svg>
