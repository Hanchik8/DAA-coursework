  <rect class="node" x="833" y="330" width="126" height="66" rx="7"/>
  <text class="size" x="896" y="356">n = 1</text>
  <text class="local" x="896" y="381">1 print</text>
  <rect class="base" x="12" y="440" width="104" height="66" rx="7"/>
  <text class="size" x="64" y="466">n = 0</text>
  <text class="local" x="64" y="491">base: 0</text>
