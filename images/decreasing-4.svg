  <text class="local" x="448" y="491">base: 0</text>
  <rect class="base" x="524" y="440" width="104" height="66" rx="7"/>
  <text class="size" x="576" y="466">n = 0</text>
  <text class="local" x="576" y="491">base: 0</text>
  <rect class="base" x="652" y="440" width="104" height="66" rx="7"/>
  <text class="size" x="704" y="466">n = 0</text>
  <text class="local" x="704" y="491">base: 0</text>
  <rect class="base" x="780" y="440" width="104" height="66" rx="7"/>
  <text class="size" x="832" y="466">n = 0</text>
